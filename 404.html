<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>404 · Barcino Meats</title>
    <meta name="description" content="Barcino Meats - 404 Not Found">

    <!-- Favicon -->
    <link rel="icon" href="assets/img/brand/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #77143c;
            --accent-gold: #debf7c;
            --accent-gold-dark: #ad935b;
            --accent-gold-glow: rgba(222, 191, 124, 0.18);
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Source Sans Pro', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: radial-gradient(circle at 50% 25%, #560e2b 0%, #2f0617 55%, #18030c 100%);
            color: var(--text-white);
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient light overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(rgba(222, 191, 124, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px 48px;
            width: 100%;
        }

        .logo-wrap img {
            height: 42px;
            width: auto;
            display: block;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .logo-wrap img:hover {
            opacity: 1;
        }

        /* Language Switcher */
        .lang-switch {
            display: inline-flex;
            align-items: center;
            background: rgba(24, 3, 12, 0.55);
            border: 1px solid rgba(222, 191, 124, 0.3);
            border-radius: 999px;
            padding: 3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .lang-btn:hover {
            color: var(--text-white);
        }

        .lang-btn.active {
            background: var(--accent-gold);
            color: #240512;
            box-shadow: 0 2px 10px rgba(222, 191, 124, 0.35);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 10;
            max-width: 680px;
            margin: auto;
            padding: 24px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bone Icon Graphic */
        .graphic-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .graphic-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent-gold-glow) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .bone-svg {
            width: 86px;
            height: 86px;
            stroke: var(--accent-gold);
            filter: drop-shadow(0 4px 14px rgba(222, 191, 124, 0.3));
            position: relative;
            z-index: 2;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.92); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        /* 404 Number */
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(3.5rem, 9vw, 5.5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .separator {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin: 10px 0 24px;
        }

        /* Headline & Paragraph */
        .headline {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--accent-gold);
            margin-bottom: 16px;
            min-height: 2.4rem;
            transition: opacity 0.25s ease;
        }

        .description {
            font-size: clamp(1rem, 2.2vw, 1.15rem);
            color: var(--text-muted);
            line-height: 1.7;
            font-weight: 300;
            max-width: 540px;
            min-height: 3.5rem;
            transition: opacity 0.25s ease;
        }

        .fade-out {
            opacity: 0;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            padding: 24px 48px;
            text-align: center;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.4);
            font-family: var(--font-body);
        }

        /* Responsive */
        @media (max-width: 600px) {
            header {
                padding: 24px 20px;
            }
            .logo-wrap img {
                height: 34px;
            }
            main {
                padding: 16px 20px;
            }
            footer {
                padding: 20px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-wrap">
            <img src="assets/img/brand/logo-light_P175_2.png" alt="Barcino Meats">
        </div>

        <nav class="lang-switch" aria-label="Language selection">
            <button class="lang-btn active" id="btnEn" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="btnEs" onclick="setLanguage('es')">ES</button>
        </nav>
    </header>

    <!-- Main 404 Content -->
    <main>
        <div class="graphic-wrap" aria-hidden="true">
            <!-- Stylized Minimal Butcher Bone SVG -->
            <svg class="bone-svg" viewBox="0 0 64 64" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Clean Minimal Bone Outline -->
                <path d="M19 12 C15 12, 12 15, 12 19 C12 21.5, 13.5 23.5, 15.5 24.5 C13.5 25.5, 12 27.5, 12 30 C12 34, 15 37, 19 37 C21 37, 22.8 36.2, 24 34.8 L40 47.8 C41.2 49.2, 43 50, 45 50 C49 50, 52 47, 52 43 C52 40.5, 50.5 38.5, 48.5 37.5 C50.5 36.5, 52 34.5, 52 32 C52 28, 49 25, 45 25 C43 25, 41.2 25.8, 40 27.2 L24 14.2 C22.8 12.8, 21 12, 19 12 Z" />
                <path d="M21 21 L43 39" stroke-dasharray="2 3" opacity="0.5" />
            </svg>
        </div>

        <div class="error-code">404</div>
        <div class="separator" aria-hidden="true"></div>

        <h1 class="headline" id="headlineText">Down to the bone.</h1>
        <p class="description" id="descText">
            There is nothing left to carve on this page. The link you followed has expired, been relocated, or is no longer part of our active catalog.
        </p>
    </main>

    <!-- Footer -->
    <footer>
        <span id="footerText">© 2026 Barcino Meats · Premium Quality &amp; International Meat Trading</span>
    </footer>

    <script>
        const translations = {
            en: {
                title: "404 · Barcino Meats",
                headline: "Down to the bone.",
                desc: "There is nothing left to carve on this page. The link you followed has expired, been relocated, or is no longer part of our active catalog.",
                footer: "© 2026 Barcino Meats · Premium Quality & International Meat Trading"
            },
            es: {
                title: "404 · Barcino Meats",
                headline: "Nos hemos quedado en el hueso.",
                desc: "Aquí no queda nada magro que cortar. El enlace solicitado ha expirado, ha sido reubicado o ya no forma parte de nuestro catálogo activo.",
                footer: "© 2026 Barcino Meats · Calidad Premium y Comercio Cárnico Internacional"
            }
        };

        function setLanguage(lang) {
            const headlineEl = document.getElementById("headlineText");
            const descEl = document.getElementById("descText");
            const footerEl = document.getElementById("footerText");
            const btnEn = document.getElementById("btnEn");
            const btnEs = document.getElementById("btnEs");

            if (!translations[lang]) return;

            // Fade transition
            headlineEl.classList.add("fade-out");
            descEl.classList.add("fade-out");

            setTimeout(() => {
                headlineEl.textContent = translations[lang].headline;
                descEl.textContent = translations[lang].desc;
                footerEl.textContent = translations[lang].footer;
                document.title = translations[lang].title;
                document.documentElement.lang = lang;

                headlineEl.classList.remove("fade-out");
                descEl.classList.remove("fade-out");

                if (lang === 'es') {
                    btnEs.classList.add("active");
                    btnEn.classList.remove("active");
                } else {
                    btnEn.classList.add("active");
                    btnEs.classList.remove("active");
                }
            }, 180);
        }
    </script>
</body>
</html>
